<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aufgaben Geschäftsstelle</title>
<style>
  :root {
    --red: #bd0010;
    --orange: #e95a0b;
    --border: #d7dce3;
    --bg: #f7f8fa;
    --text: #1f2937;
    --muted: #6b7280;
    --danger: #b3261e;
    --success: #2fa652;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0; padding: 0;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
    /* Die Seite selbst (bzw. der iFrame) soll nie höher werden als der verfügbare
       Platz und nie scrollen - nur #app scrollt intern. */
    overflow: hidden;
  }
  #app {
    max-width: 640px;
    height: 100%;
    margin: 0 auto;
    padding: 0 20px 40px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  #new-task-row {
    position: sticky; top: 0; z-index: 10;
    text-align: center;
    background: var(--bg);
    padding: 16px 0 10px;
    margin-bottom: 8px;
  }
  #new-task-toggle {
    padding: 7px 16px; border: 1px solid var(--red); border-radius: 6px;
    background: #fff; color: var(--red); font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  #new-task-form {
    background: #fff; border: 1px solid var(--border); border-radius: 8px;
    padding: 14px; margin-bottom: 18px;
    display: flex; flex-direction: column; gap: 8px;
  }
  #new-task-form[hidden] { display: none; }
  #new-task-form input, #new-task-form select {
    padding: 7px 10px; border: 1px solid var(--border); border-radius: 5px;
    font-size: 13.5px; font-family: inherit; width: 100%; background: #fff;
  }
  #new-task-form .field-label { font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }
  #new-task-form .field-hint { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  #new-task-form .field-row { display: flex; gap: 8px; }
  #new-task-form .field-row > div { flex: 1; }
  #new-task-form .form-actions { display: flex; gap: 8px; margin-top: 4px; }
  #new-task-form .form-actions button {
    padding: 7px 16px; border: none; border-radius: 5px;
    font-size: 13px; cursor: pointer; font-family: inherit;
  }
  #new-task-form .create-btn { background: var(--red); color: #fff; }
  #new-task-form .cancel-btn { background: none; color: var(--muted); }
  #new-task-error { font-size: 12.5px; color: var(--danger); }

  #hint, #error {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    margin-top: 24px;
  }
  #error { color: var(--danger); }

  .day-group { margin-bottom: 48px; }
  .day-heading {
    font-size: 13px;
    font-weight: 700;
    color: var(--red);
    text-transform: uppercase;
    letter-spacing: 0.02em;
    border-bottom: 2px solid var(--red);
    padding-bottom: 4px;
    margin-bottom: 8px;
  }

  .task {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 8px;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .task.removing { opacity: 0; transform: translateX(8px); }

  .task-top { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
  .task-row { display: flex; gap: 12px; align-items: baseline; flex: 1 1 auto; min-width: 0; }
  .task-time {
    flex: 0 0 auto;
    width: 58px;
    font-size: 12.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .task-body { flex: 1 1 auto; min-width: 0; }
  .task-name { font-size: 14px; font-weight: 600; }
  .task-location { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .task-actions {
    display: flex; flex-direction: column; gap: 6px; flex: 0 0 auto;
  }
  .task-action {
    font-size: 15px; font-weight: 600; cursor: pointer; user-select: none;
    border: none; border-radius: 5px; padding: 5px 10px; font-family: inherit;
    color: #fff; line-height: 1;
  }
  .task-action.done { background: var(--success); }
  .task-action.move { background: var(--orange); }
  .task-action:disabled { opacity: 0.5; cursor: default; }

  .move-form {
    margin-top: 10px; padding-left: 70px;
  }
  .move-form .quick-picks, .move-form .custom-date {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  .move-form input {
    padding: 5px 8px; border: 1px solid var(--border); border-radius: 5px;
    font-size: 13px; font-family: inherit;
  }
  .move-form button {
    padding: 5px 12px; border: none; border-radius: 5px;
    font-size: 12.5px; cursor: pointer; font-family: inherit;
  }
  .move-form .quick-btn { background: #fdece0; color: var(--orange); }
  .move-form .save-btn { background: var(--orange); color: #fff; }
  .move-form .cancel-btn, .move-form .back-btn { background: none; color: var(--muted); }
  .task-error { font-size: 12px; color: var(--danger); margin-top: 6px; padding-left: 70px; }
</style>
</head>
<body>
<div id="app">
  <div id="new-task-row">
    <button type="button" id="new-task-toggle">+ Neue Aufgabe</button>
  </div>
  <div id="new-task-form" hidden>
    <div>
      <div class="field-label">Aufgabe</div>
      <input type="text" id="new-task-name" placeholder="Was ist zu tun?">
    </div>
    <div class="field-row">
      <div>
        <div class="field-label">Datum</div>
        <input type="date" id="new-task-date">
      </div>
      <div>
        <div class="field-label">Uhrzeit (optional, sonst ganztägig)</div>
        <input type="time" id="new-task-time">
      </div>
    </div>
    <div>
      <div class="field-label">Ort (optional)</div>
      <input type="text" id="new-task-location" placeholder="z. B. Geschäftsstelle">
    </div>
    <div>
      <div class="field-label">Wiederholung</div>
      <select id="new-task-recurrence">
        <option value="none">Keine Wiederholung</option>
        <option value="daily">Jeden Tag</option>
        <option value="weekly">Jede Woche</option>
        <option value="monthly">Jeden Monat</option>
        <option value="quarterly">Alle drei Monate</option>
        <option value="yearly">Jedes Jahr</option>
      </select>
    </div>
    <div id="new-task-expiry-row" hidden>
      <div class="field-label">Verfallsdatum (optional, sonst max. 2 Jahre)</div>
      <input type="date" id="new-task-expiry">
      <div class="field-hint">Ohne Angabe endet die Wiederholung automatisch nach maximal 2 Jahren. Es werden maximal 120 Termine auf einmal angelegt.</div>
    </div>
    <div id="new-task-error"></div>
    <div class="form-actions">
      <button type="button" class="create-btn" id="new-task-submit">Anlegen</button>
      <button type="button" class="cancel-btn" id="new-task-cancel">Abbrechen</button>
    </div>
  </div>

  <div id="hint">Lädt …</div>
  <div id="error" hidden></div>
  <div id="results"></div>
</div>

<script>
  const TASKS_URL = "https://cclcdhwnzkzciwjaclzt.supabase.co/functions/v1/aufgaben-gs-events";
  const UPDATE_URL = "https://cclcdhwnzkzciwjaclzt.supabase.co/functions/v1/aufgaben-gs-update";

  const hint = document.getElementById("hint");
  const errorBox = document.getElementById("error");
  const resultsBox = document.getElementById("results");

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // Bei "Geschäftsstelle (Adresse)" reicht in der Uebersicht der Name ohne die Klammer-Adresse.
  function simplifyLocation(loc) {
    if (!loc) return loc;
    return loc.replace(/^Geschäftsstelle\s*\([^)]*\)\s*$/i, "Geschäftsstelle");
  }

  function dayKey(iso) {
    return iso.slice(0, 10);
  }

  function formatDayHeading(iso) {
    const d = new Date(iso);
    const today = new Date();
    const isToday = d.toDateString() === today.toDateString();
    const label = d.toLocaleDateString("de-DE", { weekday: "long", day: "2-digit", month: "2-digit", year: "numeric" });
    return isToday ? `Heute – ${label}` : label;
  }

  function formatTime(iso, allDay) {
    if (allDay) return "";
    return new Date(iso).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  }

  function pad(n) { return String(n).padStart(2, "0"); }

  function localDateStr(d) {
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  function toLocalDateInputValue(iso) {
    return localDateStr(new Date(iso));
  }

  function toLocalDateTimeInputValue(iso) {
    const d = new Date(iso);
    return `${localDateStr(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  // Naechster Montag "naechste Woche": ist heute bereits Montag, zaehlt das nicht als
  // "naechste Woche" -> dann +7 statt +0.
  function quickTargetDate(kind) {
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    if (kind === "tomorrow") {
      d.setDate(d.getDate() + 1);
    } else if (kind === "dayAfterTomorrow") {
      d.setDate(d.getDate() + 2);
    } else if (kind === "nextMonday") {
      const day = d.getDay();
      const daysToAdd = ((1 - day + 7) % 7) || 7;
      d.setDate(d.getDate() + daysToAdd);
    }
    return d;
  }

  function removeTaskEl(taskEl) {
    taskEl.classList.add("removing");
    setTimeout(() => {
      const group = taskEl.closest(".day-group");
      taskEl.remove();
      if (group && !group.querySelector(".task")) group.remove();
      if (!resultsBox.querySelector(".task")) {
        hint.textContent = "Keine offenen Aufgaben mehr im gewählten Zeitraum.";
        hint.hidden = false;
      }
    }, 250);
  }

  async function callUpdate(payload) {
    const resp = await fetch(UPDATE_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || "Unbekannter Fehler.");
    return data;
  }

  function showTaskError(taskEl, message) {
    let errEl = taskEl.querySelector(".task-error");
    if (!errEl) {
      errEl = document.createElement("div");
      errEl.className = "task-error";
      taskEl.appendChild(errEl);
    }
    errEl.textContent = message;
  }

  async function markDone(taskEl, id, btn) {
    btn.disabled = true;
    try {
      await callUpdate({ action: "done", id });
      removeTaskEl(taskEl);
    } catch (e) {
      btn.disabled = false;
      showTaskError(taskEl, "Fehler: " + e.message);
    }
  }

  function dateAndDurationToStartEnd(task, targetDate) {
    const durationMs = new Date(task.end).getTime() - new Date(task.start).getTime();
    if (task.allDay) {
      const dateStr = localDateStr(targetDate);
      return {
        newStart: new Date(`${dateStr}T00:00:00`).toISOString(),
        newEnd: new Date(`${dateStr}T23:59:59`).toISOString(),
      };
    }
    const orig = new Date(task.start);
    const newStartDate = new Date(
      targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate(),
      orig.getHours(), orig.getMinutes(), orig.getSeconds()
    );
    return {
      newStart: newStartDate.toISOString(),
      newEnd: new Date(newStartDate.getTime() + durationMs).toISOString(),
    };
  }

  async function performMove(taskEl, task, newStart, newEnd, busyBtn) {
    if (busyBtn) busyBtn.disabled = true;
    try {
      await callUpdate({ action: "move", id: task.id, newStart, newEnd });
      removeTaskEl(taskEl);
    } catch (e) {
      if (busyBtn) busyBtn.disabled = false;
      showTaskError(taskEl, "Fehler: " + e.message);
    }
  }

  function showCustomDatePicker(taskEl, task, formEl) {
    const quickEl = formEl.querySelector(".quick-picks");
    let customEl = formEl.querySelector(".custom-date");
    if (customEl) { quickEl.hidden = true; customEl.hidden = false; return; }

    customEl = document.createElement("div");
    customEl.className = "custom-date";
    if (task.allDay) {
      customEl.innerHTML =
        `<input type="date" class="move-date" value="${toLocalDateInputValue(task.start)}">` +
        `<button type="button" class="save-btn">Speichern</button>` +
        `<button type="button" class="back-btn">Zurück</button>`;
    } else {
      customEl.innerHTML =
        `<input type="datetime-local" class="move-datetime" value="${toLocalDateTimeInputValue(task.start)}">` +
        `<button type="button" class="save-btn">Speichern</button>` +
        `<button type="button" class="back-btn">Zurück</button>`;
    }
    formEl.appendChild(customEl);
    quickEl.hidden = true;

    customEl.querySelector(".back-btn").addEventListener("click", () => {
      customEl.hidden = true;
      quickEl.hidden = false;
    });

    customEl.querySelector(".save-btn").addEventListener("click", () => {
      const saveBtn = customEl.querySelector(".save-btn");
      let targetDate;
      if (task.allDay) {
        const dateVal = customEl.querySelector(".move-date").value;
        if (!dateVal) return;
        targetDate = new Date(`${dateVal}T00:00:00`);
      } else {
        const dtVal = customEl.querySelector(".move-datetime").value;
        if (!dtVal) return;
        targetDate = new Date(dtVal);
      }
      const { newStart, newEnd } = dateAndDurationToStartEnd(task, targetDate);
      performMove(taskEl, task, newStart, newEnd, saveBtn);
    });
  }

  function openMoveForm(taskEl, task, moveBtn) {
    if (taskEl.querySelector(".move-form")) return;
    moveBtn.disabled = true;

    const formEl = document.createElement("div");
    formEl.className = "move-form";
    formEl.innerHTML =
      `<div class="quick-picks">` +
        `<button type="button" class="quick-btn" data-q="tomorrow">Morgen</button>` +
        `<button type="button" class="quick-btn" data-q="dayAfterTomorrow">Übermorgen</button>` +
        `<button type="button" class="quick-btn" data-q="nextMonday">Nächste Woche (Mo)</button>` +
        `<button type="button" class="quick-btn" data-q="custom">Datum …</button>` +
        `<button type="button" class="cancel-btn">Abbrechen</button>` +
      `</div>`;
    taskEl.appendChild(formEl);

    formEl.querySelector(".cancel-btn").addEventListener("click", () => {
      formEl.remove();
      moveBtn.disabled = false;
    });

    formEl.querySelectorAll(".quick-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const kind = btn.dataset.q;
        if (kind === "custom") {
          showCustomDatePicker(taskEl, task, formEl);
          return;
        }
        const targetDate = quickTargetDate(kind);
        const { newStart, newEnd } = dateAndDurationToStartEnd(task, targetDate);
        performMove(taskEl, task, newStart, newEnd, btn);
      });
    });
  }

  function renderTasks(tasks) {
    resultsBox.innerHTML = "";
    if (tasks.length === 0) {
      hint.textContent = "Keine Aufgaben im gewählten Zeitraum.";
      hint.hidden = false;
      return;
    }
    hint.hidden = true;

    let currentDay = null;
    let groupEl = null;
    for (const t of tasks) {
      const key = dayKey(t.start);
      if (key !== currentDay) {
        currentDay = key;
        groupEl = document.createElement("div");
        groupEl.className = "day-group";
        groupEl.innerHTML = `<div class="day-heading">${escapeHtml(formatDayHeading(t.start))}</div>`;
        resultsBox.appendChild(groupEl);
      }
      const taskEl = document.createElement("div");
      taskEl.className = "task";
      const time = formatTime(t.start, t.allDay);
      taskEl.innerHTML =
        `<div class="task-top">` +
          `<div class="task-row">` +
            `<div class="task-time">${time ? escapeHtml(time) : ""}</div>` +
            `<div class="task-body">` +
              `<div class="task-name">${escapeHtml(t.name)}</div>` +
              (t.location ? `<div class="task-location">${escapeHtml(simplifyLocation(t.location))}</div>` : "") +
            `</div>` +
          `</div>` +
          `<div class="task-actions">` +
            `<button type="button" class="task-action done" title="Erledigt" aria-label="Erledigt">✓</button>` +
            `<button type="button" class="task-action move" title="Verschieben" aria-label="Verschieben">↻</button>` +
          `</div>` +
        `</div>`;

      const doneBtn = taskEl.querySelector(".task-action.done");
      const moveBtn = taskEl.querySelector(".task-action.move");
      doneBtn.addEventListener("click", () => markDone(taskEl, t.id, doneBtn));
      moveBtn.addEventListener("click", () => openMoveForm(taskEl, t, moveBtn));

      groupEl.appendChild(taskEl);
    }
  }

  async function loadTasks() {
    hint.textContent = "Lädt …";
    hint.hidden = false;
    errorBox.hidden = true;
    try {
      const resp = await fetch(TASKS_URL);
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || "Unbekannter Fehler.");
      renderTasks(data.tasks);
    } catch (e) {
      hint.hidden = true;
      errorBox.textContent = "Fehler beim Laden: " + e.message;
      errorBox.hidden = false;
    }
  }

  const MAX_OCCURRENCES = 120;
  const DEFAULT_EXPIRY_MS = 2 * 365 * 24 * 60 * 60 * 1000; // 2 Jahre, wenn kein Verfallsdatum angegeben

  // Easyverein bietet ueber die oeffentliche API keine echten Wiederholungsregeln (das
  // "interval"-Feld ist read-only) -> stattdessen werden individuelle, eigenstaendig
  // abhakbare Termine bis zum Verfallsdatum (Standard: 2 Jahre) angelegt, begrenzt auf
  // MAX_OCCURRENCES, damit das Anlegen nicht ewig dauert bzw. das Anfragelimit sprengt.
  function addRecurrenceOffset(date, recurrence, index) {
    const d = new Date(date);
    if (recurrence === "daily") d.setDate(d.getDate() + index);
    else if (recurrence === "weekly") d.setDate(d.getDate() + index * 7);
    else if (recurrence === "monthly") d.setMonth(d.getMonth() + index);
    else if (recurrence === "quarterly") d.setMonth(d.getMonth() + index * 3);
    else if (recurrence === "yearly") d.setFullYear(d.getFullYear() + index);
    return d;
  }

  function buildOccurrences(dateVal, timeVal, recurrence, expiryVal) {
    const baseDate = timeVal ? new Date(`${dateVal}T${timeVal}:00`) : new Date(`${dateVal}T00:00:00`);

    if (recurrence === "none") {
      if (timeVal) {
        return { occurrences: [{ start: baseDate.toISOString(), end: new Date(baseDate.getTime() + 60 * 60 * 1000).toISOString() }], truncated: false, totalPossible: 1 };
      }
      return { occurrences: [{ start: new Date(`${dateVal}T00:00:00`).toISOString(), end: new Date(`${dateVal}T23:59:59`).toISOString() }], truncated: false, totalPossible: 1 };
    }

    const expiryDate = expiryVal ? new Date(`${expiryVal}T23:59:59`) : new Date(baseDate.getTime() + DEFAULT_EXPIRY_MS);
    const occurrences = [];
    let totalPossible = 0;
    for (let i = 0; i < 5000; i++) {
      const occDate = addRecurrenceOffset(baseDate, recurrence, i);
      if (occDate.getTime() > expiryDate.getTime()) break;
      totalPossible++;
      if (occurrences.length < MAX_OCCURRENCES) {
        if (timeVal) {
          occurrences.push({ start: occDate.toISOString(), end: new Date(occDate.getTime() + 60 * 60 * 1000).toISOString() });
        } else {
          const dateStr = localDateStr(occDate);
          occurrences.push({ start: new Date(`${dateStr}T00:00:00`).toISOString(), end: new Date(`${dateStr}T23:59:59`).toISOString() });
        }
      }
    }
    return { occurrences, truncated: totalPossible > occurrences.length, totalPossible };
  }

  const newTaskToggle = document.getElementById("new-task-toggle");
  const newTaskForm = document.getElementById("new-task-form");
  const newTaskName = document.getElementById("new-task-name");
  const newTaskDate = document.getElementById("new-task-date");
  const newTaskTime = document.getElementById("new-task-time");
  const newTaskLocation = document.getElementById("new-task-location");
  const newTaskRecurrence = document.getElementById("new-task-recurrence");
  const newTaskExpiryRow = document.getElementById("new-task-expiry-row");
  const newTaskExpiry = document.getElementById("new-task-expiry");
  const newTaskError = document.getElementById("new-task-error");
  const newTaskSubmit = document.getElementById("new-task-submit");
  const newTaskCancel = document.getElementById("new-task-cancel");

  function resetNewTaskForm() {
    newTaskName.value = "";
    newTaskDate.value = "";
    newTaskTime.value = "";
    newTaskLocation.value = "";
    newTaskRecurrence.value = "none";
    newTaskExpiry.value = "";
    newTaskExpiryRow.hidden = true;
    newTaskError.textContent = "";
  }

  newTaskToggle.addEventListener("click", () => {
    if (!newTaskForm.hidden) return;
    newTaskForm.hidden = false;
    newTaskDate.value = localDateStr(new Date());
    newTaskName.focus();
  });

  newTaskCancel.addEventListener("click", () => {
    newTaskForm.hidden = true;
    resetNewTaskForm();
  });

  newTaskRecurrence.addEventListener("change", () => {
    newTaskExpiryRow.hidden = newTaskRecurrence.value === "none";
  });

  newTaskSubmit.addEventListener("click", async () => {
    const name = newTaskName.value.trim();
    const dateVal = newTaskDate.value;
    const timeVal = newTaskTime.value;
    const location = newTaskLocation.value.trim();
    const recurrence = newTaskRecurrence.value;
    const expiryVal = newTaskExpiry.value;

    if (!name || !dateVal) {
      newTaskError.textContent = "Bitte Aufgabe und Datum angeben.";
      return;
    }

    const allDay = !timeVal;
    const { occurrences, truncated, totalPossible } = buildOccurrences(dateVal, timeVal, recurrence, expiryVal);

    newTaskSubmit.disabled = true;
    newTaskError.textContent = "";
    try {
      await callUpdate({ action: "create", name, location, allDay, occurrences });
      if (truncated) {
        const lastDate = new Date(occurrences[occurrences.length - 1].start).toLocaleDateString("de-DE");
        alert(`Hinweis: Es wären ${totalPossible} Termine bis zum Verfallsdatum möglich gewesen. Angelegt wurden die ersten ${occurrences.length} (bis ${lastDate}) – mehr auf einmal ist aus Performance-Gründen begrenzt. Bei Bedarf danach einfach erneut "Neue Aufgabe" mit Wiederholung anlegen.`);
      }
      newTaskForm.hidden = true;
      resetNewTaskForm();
      await loadTasks();
    } catch (e) {
      newTaskError.textContent = "Fehler: " + e.message;
    } finally {
      newTaskSubmit.disabled = false;
    }
  });

  loadTasks();
</script>
</body>
</html>
